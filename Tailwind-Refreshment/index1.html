<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode Tailwind CDN</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
</head>
<body class="bg-white text-black transition-colors duration-300 dark:bg-gray-900">

  <!-- Tombol Toggle -->
  <button id="toggleDark" class="px-4 py-2 bg-amber-400 text-black rounded-lg m-4">
    Toggle Dark Mode
  </button>

  <!-- Konten -->
  <div class="p-6">
    <h1 class="text-2xl font-bold dark:text-amber-400">Hello, Faiz!</h1>
    <p class="mt-2 text-zinc-600 dark:text-zinc-300">
      Ini contoh dark mode dengan Tailwind CDN.
    </p>
  </div>

  <script>
    const html = document.documentElement;
    const btn = document.getElementById("toggleDark");

    btn.addEventListener("click", () => {
      html.classList.toggle("dark");
    });
  </script>
</body>
</html>
